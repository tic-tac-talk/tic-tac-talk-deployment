apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      serviceAccountName: chat-sa
      securityContext:
        fsGroup: 2000
      containers:
        - name: chat-container
          image: leesy010504/ttt-chat:2af68d49c432e708be5de5c88a03b70e41886b3e
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 300m
              memory: 1500Mi
            limits:
              cpu: 3000m
              memory: 2700Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_FAIL_FAST
              value: "true"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG
              value: "DEBUG"
            - name: SPRING_CONFIG_IMPORT
              value: "kubernetes:,kubernetes:secrets"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_NAME
              value: "chat-config"
          envFrom:
            - secretRef:
                name: chat-secret
          ports:
            - containerPort: 8080
