apiVersion: v1
kind: Secret
metadata:
  name: security-secret
  namespace: prod
  labels:
    app: security-service
    env: prod
type: Opaque
stringData:
  DB_PASSWORD: "your-db-password-here"
  KAKAO_CLIENT_ID: "your-kakao-client-id"
  KAKAO_CLIENT_SECRET: "your-kakao-client-secret"
  JWT_SECRET: "your-jwt-secret-key-here"


