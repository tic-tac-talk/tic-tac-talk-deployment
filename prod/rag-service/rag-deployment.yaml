apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: rag-sa
      securityContext:
        fsGroup: 2000
      containers:
        - name: rag-container
          image: leesy010504/ttt-rag:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 300m
              memory: 1500Mi
            limits:
              cpu: 3000m
              memory: 2700Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_FAIL_FAST
              value: "true"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG
              value: "DEBUG"
            - name: SPRING_CONFIG_IMPORT
              value: "kubernetes:,kubernetes:secrets"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_NAME
              value: "rag-config"
          envFrom:
            - secretRef:
                name: rag-secret
          ports:
            - containerPort: 8080
