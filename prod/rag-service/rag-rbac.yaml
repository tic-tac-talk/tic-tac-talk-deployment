---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-sa
  labels:
    app: rag-service
    env: prod
    version: v1.0.0
  namespace: prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-role
  labels:
    app: rag-service
    env: prod
    version: v1.0.0
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rag-binding
  labels:
    app: rag-service
    env: prod
    version: v1.0.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rag-role
subjects:
- kind: ServiceAccount
  name: rag-sa
  namespace: prod

