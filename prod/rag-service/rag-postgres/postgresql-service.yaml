apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: prod
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresql

---

apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: prod
spec:
  type: ClusterIP     
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresql
